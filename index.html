<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Legend of Pelda</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0c0c14;--fg:#e8e8f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c14;--fg:#e8e8f0}}
:root[data-theme="dark"]{--bg:#0c0c14;--fg:#e8e8f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
canvas{image-rendering:pixelated;width:min(100%,calc((100dvh - 16px)*1.2308));background:#000;touch-action:none}
#pad{display:none;width:100%;max-width:420px;justify-content:space-between;align-items:center;padding:0 12px;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){#pad{display:flex}canvas{width:min(100%,calc((100dvh - 170px)*1.2308))}}
.dp{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:2px}
.dp b:nth-child(1){grid-area:1/2}.dp b:nth-child(2){grid-area:2/1}.dp b:nth-child(3){grid-area:2/3}.dp b:nth-child(4){grid-area:3/2}
.ab{display:grid;grid-template-columns:repeat(3,46px);gap:6px}
#pad b{display:flex;align-items:center;justify-content:center;background:#2a2a44;border:2px solid #5a5a8a;border-radius:10px;font:bold 18px Georgia,serif;color:#fff}
#pad b:active{background:#5a5a8a}
</style></head><body>

w.....", "......wwww......", ".....wwkkww.....", ".......ww.......", "...wwwwwwwwww...", "....wSwwwwSw....", "...wwwwwwwwww...", "....wSwwwwSw....", ".....wwwwww.....", "....ww....ww....", "....ww....ww....", "...www....www..."], "b": ["", ".w..............", ".ww.......lL.lL.", ".wll.....lLLlLLl", "..lllL..lLLLLLLl", ".lklllLLLLLLLLLL", ".lllllLLLLLLLLLL", "llyyylLLLyyyLLLL", ".llyylLLyyyyyLL.", "..llllLLLyyyyLL.", "....LLLLLLLLLLL.", "....lLLLLLLLLL..", "....lL.lL..lL...", "...llL.llL.llL.."]},TUT=[["T", "The Legend of Pelda"], ["P", "Guía para quien nunca ha jugado. Aquí tienes todo lo necesario para empezar tu aventura."], ["H", "Objetivo"], ["P", "El reino ha perdido la Trifuerza. Tú eres un héroe sin armas que debe explorar el mundo, conseguir una espada, vencer a los monstruos de la mazmorra, derrotar al dragón Aquamentus, vencer a Ganondorf y recuperar la Trifuerza dorada."], ["H", "Controles (teclado)"], ["L", "Mover: flechas o W A S D (solo en 4 direcciones)."], ["L", "Espada: Z, J o barra espaciadora."], ["L", "Bumerán: X o K."], ["L", "Poner una bomba: C o L."], ["L", "Pausa: P o Enter. En el menú de pausa puedes continuar, quitar la música o volver al menú principal."], ["L", "Entrar y salir de cuevas y de la mazmorra: acércate a la entrada y pulsa E (aparece el aviso «E para entrar»). Ya no hace falta pisar el agujero."], ["L", "Música sí/no durante la partida: M."], ["L", "Menús: flechas arriba/abajo para elegir y Enter para aceptar."], ["L", "En móvil aparecen botones táctiles en pantalla."], ["H", "Pantalla de juego"], ["L", "Arriba a la izquierda: minimapa. El cuadro parpadeante es donde estás. En la mazmorra solo se dibujan las salas que ya visitaste."], ["L", "Rupias (moneda verde), llaves y bombas que llevas."], ["L", "Casillas X, Z y C: bumerán, espada y bombas."], ["L", "A la derecha: tus corazones (VIDA). Cada corazón son dos mitades."], ["H", "Mecánicas básicas"], ["L", "Vida: empiezas con 3 corazones. Los enemigos te quitan medio o un corazón y te empujan; tras un golpe eres invulnerable un instante (Link parpadea). Si llegas a cero, puedes continuar desde el inicio."], ["L", "Espada: golpea delante de ti. Con la vida llena además lanza un rayo que vuela y daña a distancia."], ["L", "Bumerán: va y vuelve solo. Aturde a los enemigos, mata a los débiles y recoge objetos del suelo."], ["L", "Bombas: explotan a los 1,5 s y hacen mucho daño alrededor. No te hieren a ti. Se compran en la tienda."], ["L", "Rupias y corazones: todos los enemigos sueltan rupias (las verdes valen 1, las azules 5; los jefes sueltan varias azules) y a veces un corazón. Se recogen al tocarlos y desaparecen si tardas."], ["L", "Cuevas: las entradas negras entre rocas; acércate y pulsa E. Dentro hay un viejo con objetos o una tienda. Para salir, ve a la puerta inferior y pulsa E."], ["L", "Llaves y puertas: las puertas con candado dorado de la mazmorra se abren al acercarte con una llave. Cada una gasta una llave."], ["L", "Contenedor de corazón: el jefe lo suelta y aumenta tu vida máxima."], ["H", "Enemigos"], ["L", "Octorok (rojo): escupe piedras. Dispara cuando te mira, así que esquiva de lado."], ["L", "Moblin (azul): te persigue y resiste dos golpes."], ["L", "Tektite: salta hacia ti en arcos. Golpéalo cuando aterriza."], ["L", "Leever: se entierra en la arena y aparece cerca de ti. Enterrado no se le puede dañar."], ["L", "Peahat: vuela sin parar con su hélice. Solo se le hiere cuando se queda quieto; las bombas siempre le afectan."], ["L", "Keese (murciélago): vuelo errático por la mazmorra. Muere de un golpe."], ["L", "Gel: blob lento y débil."], ["L", "Rope: serpiente que embiste en línea recta cuando te ve alineado. Muévete de lado."], ["L", "Stalfos: esqueleto resistente que te persigue."], ["L", "Aquamentus (jefe de la mazmorra): lanza una sola bola de fuego lenta hacia ti. Puedes dañarlo con la espada, el bumerán y las bombas. Aguanta 8 golpes y, al vencerlo, se abre el sello morado de su sala."], ["L", "Ganondorf (jefe final): despierta de una estatua de piedra al entrar en su sala y su barra de vida aparece arriba. Lanza abanicos de bolas mágicas y se teletransporta (invulnerable mientras desaparece). Con la mitad de vida embiste e invoca murciélagos. Aguanta 20 golpes y al caer se convierte en piedra."], ["H", "Ruta recomendada"], ["L", "1. En la pantalla de inicio, entra en la cueva negra entre rocas, arriba a la izquierda, y coge la espada."], ["L", "2. Al este, junto al lago, hay otra cueva con el bumerán."], ["L", "3. Cuando tengas rupias, visita la tienda de la pantalla de abajo a la izquierda: bombas y recarga de vida."], ["L", "4. El mundo es grande (8 x 5 pantallas). La mazmorra está en la esquina inferior derecha del mapa. Hay otra tienda al sur, hacia el centro, y una cueva con un contenedor de corazón en el norte."], ["L", "5. La mazmorra tiene muchas salas y dos puertas con candado. Busca la llave del fondo a la derecha de la planta baja y la llave de la sala del piso de arriba; también hay una bomba y un contenedor de corazón escondidos."], ["L", "6. Vence a Aquamentus: el sello morado se abre. Recoge el contenedor de corazón y sube a enfrentarte a Ganondorf."], ["L", "7. Cuando Ganondorf se convierta en piedra, coge la Trifuerza para ganar."], ["H", "Guardado automático"], ["L", "El juego guarda solo al cambiar de pantalla, entrar o salir de cuevas, recoger objetos y cada pocos segundos (verás «● GUARDADO»)."], ["L", "Al volver a abrir el juego, el menú principal ofrece CONTINUAR. Salir al menú desde la pausa también guarda."], ["L", "NUEVA PARTIDA borra el guardado. Se guarda en tu navegador: si borras los datos del sitio, se pierde. Ganar el juego también borra el guardado."], ["L", "REINICIAR PARTIDA (en Ajustes) borra tu progreso: pide confirmar pulsando Enter una segunda vez. Los enemigos que derrotes quedan guardados con la partida."], ["H", "Consejos"], ["L", "Mantén la vida llena para disparar rayos con la espada."], ["L", "Los enemigos de superficie pueden soltar corazones: no los gastes todos antes de entrar a la mazmorra."], ["L", "Los enemigos derrotados no reaparecen: puedes volver a una pantalla sin miedo."], ["L", "Ajustes: desde el menú principal puedes quitar la música, volver a descargar este tutorial o reiniciar tu partida."], ["L", "Contra Ganondorf: golpéalo cuando esté visible, no cuando se desvanece, y esquiva su abanico de bolas moviéndote hacia los huecos."], ["H", "Créditos"], ["P", "Sprites de Link: Mister Mike. Sprites de Ganondorf: bucketboy (editados de un rip de King of Hyrule). Juego hecho por fans, sin relación con Nintendo."]];
